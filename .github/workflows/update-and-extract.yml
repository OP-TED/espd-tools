name: Update submodule and extract ESPD_CM.eapx to JSON

on:
  # Triggered automatically from espd-conceptual-model
  repository_dispatch:
    types: [update_eapx]

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
    update-and-extract:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository with submodules
              uses: OP-TED/checkout@v4
              with:
                  submodules: true
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Add or update submodule
              run: |
                  if [ ! -d "EAtoJSON/conceptual-model" ]; then
                    git submodule add https://github.com/OP-TED/espd-conceptual-model.git EAtoJSON/conceptual-model
                    git submodule update --init --recursive
                  else
                    git submodule update --remote --merge EAtoJSON/conceptual-model
                  fi  
                             
            # Reset submodule to the commit referenced by your main repo
            - name: Set up Node.js
              uses: OP=TED/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              working-directory: EAtoJSON
              run: npm ci

            - name: Extract ESPD_CM.eapx to JSON
              working-directory: EAtoJSON
              run: |
                node ea2json.js extract conceptual-model/conceptual-model/ESPD_CM.eapx
                echo "Extraction completed."

            - name: Commit and push changes
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add EAtoJSON/ESPD_CM.json || echo "No JSON file found"
                  git commit -m "Automated extraction of ESPD_CM.eapx to JSON" || echo "No changes to commit"
                  git push origin testingAutomation


            