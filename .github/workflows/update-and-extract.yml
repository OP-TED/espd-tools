name: Update submodule and extract ESPD_CM.eapx to JSON

on:
    workflow_dispatch:

jobs:
    update-and-extract:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository with submodules
              uses: actions/checkout@v4
              with:
                  submodules: true
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Update submodule to latest version
              run: |
                  git submodule update --remote --merge EAtoJSON/conceptual-model
                
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              working-directory: EAtoJSON
              run: npm ci

            - name: Extract ESPD_CM.eapx to JSON
              working-directory: EAtoJSON
              run: |
                node ea2json.js extract conceptual-model/conceptual-model/ESPD_CM.eapx
                echo: "Extraction completed."

            - name: Commit and push changes
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add EAtoJSON/ESPD_CM.json || echo "No JSON file found"
                  git commit -m "Automated extraction of ESPD_CM.eapx to JSON" || echo "No changes to commit"
                  git push origin testingAutomation


            