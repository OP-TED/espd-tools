name: Receive updated ESPD_CM.eapx from espd-conceptual-model

on:
  repository_dispatch:
    types: [update_eapx]

jobs:
  sync-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout espd-tools
        uses: actions/checkout@v4
        with:
          ref: testingAutomation

      - name: Download ESPD_CM.eapx from espd-conceptual-model
        run: |
          mkdir -p EAtoJSON
          echo "Downloading file from espd-conceptual-model..."
          curl -L -o EAtoJSON/ESPD_CM.eapx \
            https://raw.githubusercontent.com/your-org/espd-conceptual-model/testingAutomation/conceptual-model/ESPD_CM.eapx

      - name: Commit and push update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add EAtoJSON/ESPD_CM.eapx
          git commit -m "Automated sync from espd-conceptual-model (testingAutomation)" || echo "No changes to commit"
          git push origin testingAutomation
